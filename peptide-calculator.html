<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050506"><meta name="description" content="Peptide reconstitution calculator from The BioChem Society."><title>Peptide Reconstitution Calculator | The BioChem Society</title><style>html,body{margin:0;min-height:100%;background:#050506;color:#EAE1CF;font:13px/1.5 system-ui,sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;letter-spacing:.08em}</style></head><body><div id="load">Loading calculator...</div><script>(async()=>{try{const r=await Promise.all(['/assets/peptide-calculator-1.txt','/assets/peptide-calculator-2.txt','/assets/peptide-calculator-3.txt','/assets/peptide-calculator-4.txt'].map(u=>fetch(u).then(x=>{if(!x.ok)throw Error('payload');return x.text()}))),b=atob(r.join('')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const d=new DecompressionStream('gzip'),w=d.writable.getWriter();w.write(a);w.close();const t=await new Response(d.readable).text();document.open();document.write(t);document.close()}catch(e){document.getElementById('load').textContent='Unable to load calculator.';console.error(e)}})();</script></body></html>
