  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e cream of the monogram, never pure white */\n--cream-50:#FDFBF5;--cream-100:#F7F1E5;--cream-200:#EAE1CF;--cream-400:#C9BEA6;--cream-600:#8F8672;\n/* Azure — the gradient S */\n--azure-200:#8AD5F5;--azure-300:#5BC0EE;--azure-400:#3A9FDB;--azure-500:#2578BE;--azure-600:#175A9A;--azure-700:#123F73;\n--grad-azure:linear-gradient(165deg,#7FD0F4 0%,#3A9FDB 45%,#175A9A 100%); /* @kind color */\n/* Signal ratings — 🟢 strong / 🟡 emerging / 🔴 preliminary */\n--signal-strong:#4CAF78;--signal-emerging:#D9A13B;--signal-preliminary:#C4554D;\n/* Semantic aliases */\n--surface-page:var(--ink-950);--surface-card:var(--ink-900);--surface-raised:var(--ink-800);--surface-inset:var(--ink-700);\n--border-subtle:rgba(247,241,229,.09);--border-strong:rgba(247,241,229,.18);--border-accent:rgba(58,159,219,.45);\n--text-display:var(--cream-50);--text-body:var(--cream-200);--text-muted:rgba(247,241,229,.58);--text-faint:rgba(247,241,229,.34);\n--accent:var(--azure-400);--accent-strong:var(--azure-300);--accent-deep:var(--azure-600);\n--focus-ring:0 0 0 2px var(--ink-950),0 0 0 4px var(--azure-400);\n}\n<\u002Fstyle>\n<style>:root{\n--font-display:'Playfair Display',Georgia,serif;\n--font-sans:'Montserrat',system-ui,sans-serif;\n--font-mono:'IBM Plex Mono',ui-monospace,monospace;\n/* Scale */\n--text-xs:12px;--text-sm:13px;--text-base:15px;--text-lg:18px;--text-xl:22px;--text-2xl:28px;--text-3xl:36px;--text-4xl:48px;--text-5xl:64px;\n/* Leading */\n--leading-tight:1.15;--leading-snug:1.35;--leading-body:1.6;\n/* Tracking — wide letterspaced caps are a core brand move */\n--tracking-caps:.22em;--tracking-wide:.08em;--tracking-normal:0;\n/* Weights */\n--weight-light:300;--weight-regular:400;--weight-medium:500;--weight-semibold:600;--weight-bold:700;\n}\n<\u002Fstyle>\n<style>:root{\n--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;\n--radius-sm:4px;--radius-md:8px;--radius-lg:14px;--radius-pil gap:28px;flex-wrap:wrap;margin-bottom:34px\">\n      <div style=\"min-width:0;animation:bcs-rise 620ms cubic-bezier(.22,1,.36,1) both\">\n        <div style=\"display:flex;align-items:center;gap:10px;color:#5BC0EE;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;margin-bottom:20px\">\n          <span style=\"display:block;width:22px;height:1px;background:#3A9FDB;opacity:.72\"><\u002Fspan>Interactive Tool · T.002\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Playfair Display',Georgia,serif;font-size:clamp(40px,5.6vw,68px);font-weight:400;letter-spacing:-.038em;line-height:.99;color:#FDFBF5;margin:0 0 18px;max-width:16ch\">Peptide Reconstitution Calculator<\u002Fh1>\n        <p style=\"margin:0;max-width:62ch;color:#C9BEA6;font-size:15px;line-height:1.75\">Enter your quantities. The tool returns concentration, draw volume, and the syringe marking to read, using exact arithmetic.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px 26px;align-items:center;padding-top:24px;color:#8F8672;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase\">\n          \n          \n          \n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <button id=\"modeToggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Switch to solution mode\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 18px;border:1px solid rgba(91,192,238,.30);border-radius:6px;background:rgba(91,192,238,.05);color:#5BC0EE;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:background 150ms,border-color 150ms,color 150ms,box-shadow 150ms\" style-hover=\"border-color:rgba(91,192,238,.55);color:#8FD4F5;background:rgba(91,192,238,.09)\">Reverse ⇄<\u002Fbutton>\n      <button id=\"reset\" type=\"button\" aria-label=\"Reset calculator to example values\" st >\n              <button id=\"toStandard\" type=\"button\" style=\"width:100%;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 16px;border:1px solid rgba(91,192,238,.34);border-radius:6px;background:rgba(91,192,238,.06);color:#5BC0EE;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background 150ms,border-color 150ms,color 150ms\" style-hover=\"border-color:rgba(91,192,238,.6);background:rgba(91,192,238,.12);color:#8FD4F5\">Load into dose calculator →<\u002Fbutton>\n              <p style=\"margin:9px 0 0;font-size:11px;line-height:1.6;color:#8F8672\">Sends this recon volume to the standard calculator to work out dose draws.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:10px;margin-top:8px;padding:0 4px;color:#8F8672;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase\">\n              \n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div id=\"statsGrid\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid rgba(247,241,229,.075);border-bottom:1px solid rgba(247,241,229,.075);margin-top:24px\">\n            <div style=\"padding:16px 0\">\n              <span style=\"display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8F8672\">Concentration<\u002Fspan>\n              <strong id=\"concentration\" style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:400;color:#FDFBF5;margin-top:6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums\">—<\u002Fstrong>\n            <\u002Fdiv>\n            <div id=\"dosesStat\" style=\"padding:16px 0 16px 18px;border-left:1px solid rgba(247,241,229,.075)\">\n              <span style=\"display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8F8672\">Full amounts per vial<\u002Fspan>\n              <strong id=\"count\" style=\"display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:400;color:#FDFBF5;margin-top:6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums\">—<\u002Fstrong>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <p id=\"status\" style=\"display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.6;margin:16px 0 0;color:#8F8672;overflow-wrap:anywhere\"><span id=\"statusDot\" style=\"display:block;flex:none;width:5px;height:5px;border-radius:50%;margin-top:7px;background:#8F8672\"><\u002Fspan><span id=\"statusText\">Enter your quantities to calculate.<\u002Fspan><\u002Fp>\n\n          <button id=\"copy\" type=\"button\" disabled=\"\" style=\"width:100%;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;margin-top:18px;border:1px solid #F7F1E5;border-radius:6px;background:#F7F1E5;color:#050506;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.45;transition:background 150ms,box-shadow 150ms,opacity 150ms\">Copy Calculation<\u002Fbutton>\n          <p id=\"copyFeedback\" role=\"status\" hidden=\"\" style=\"margin:9px 0 0;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;color:#5BC0EE\"><\u002Fp>\n\n          <div id=\"copyPanel\" hidden=\"\" style=\"margin-top:14px\">\n            <label for=\"copyOutput\" style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#EAE1CF\">Copy your calculation<\u002Flabel>\n            <p style=\"margin:6px 0 0;font-size:11px;color:#8F8672\">Automatic copying is unavailable. Select the text and use your device’s Copy action.<\u002Fp>\n            <textarea id=\"copyOutput\" readonly=\"\" spellcheck=\"false\" style=\"display:block;width:100%;height:180px;margin:8px 0;color:#EAE1CF;background:#0A0B0D;border:1px solid rgba(247,241,229,.10);border-radius:6px;padding:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <button id=\"selectCopy\" type=\"button\" style=\"min-height:40px;padding:0 14px;border:1px solid rgba(247,241,229,.19);border-radius:6px;background:transparent;color:#EAE1CF;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase\" style-hover=\"border-color:rgba(91,192,238,.38);color:#FDFBF5\">Select text<\u002Fbutton>\n              <button id=\"closeCopy\" type=\"button\" style=\"min-height:40px;padding:0 14px;border:1px solid rgba(247,241,229,.19);border-radius:6px;background:transparent;color:#EAE1CF;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase\" style-hover=\"border-color:rgba(91,192,238,.38);color:#FDFBF5\">Close<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <p style=\"margin:14px 0 0;font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:1.7;color:#8F8672\">Preview is illustrative, not a syringe guide. ≈ means the displayed number is approximate. Results are never rounded to a syringe line. Syringe units measure volume on the selected scale, not biological potency. Solution volume is the bac water added, not a guaranteed final volume.<\u002Fp>\n\n          <details id=\"mathDetails\" style=\"margin-top:14px;border-top:1px solid rgba(247,241,229,.075)\">\n            <summary style=\"min-height:46px;display:flex;align-items:center;gap:10px;list-style:none;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8F8672\">\n              <span style=\"flex:1\">See the math<\u002Fspan><span class=\"marker\" style=\"font-size:16px;color:#5BC0EE\">+<\u002Fspan>\n            <\u002Fsummary>\n            <div style=\"font-size:11px;line-height:1.8;color:#8F8672;overflow-wrap:anywhere;padding-bottom:16px\">\n              <p id=\"formula\" style=\"margin:0 0 12px;font-family:'IBM Plex Mono',monospace;color:#C9BEA6\">Complete valid inputs to see the calculation.<\u002Fp>\n              <p style=\"margin:0 0 12px\">Concentration = vial amount ÷ final volume.<br>Draw volume = target mass ÷ concentration.<br>Syringe units = draw volume × markings per mL.<\u002Fp>\n              <p style=\"margin:0\">Full amounts are rounded down using exact arithmetic. Assumes a uniform solution and full labeled vial content; excludes transfer losses, dead space, stability, and measurement tolerances. For blends, use only the amount of the compound being calculated.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdetails>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div id=\"advanced\" style=\"grid-column:1;display:grid;gap:14px;min-width:0\">\n        <details class=\"liquid\" id=\"syringeSettings\" style=\"position:relative;overflow:hidden;padding:0 22px;border:1px solid rgba(247,241,229,.10);border-radius:14px;background:rgba(16,18,22,.94);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 18px 60px rgba(0,0,0,.42)\">\n          <summary style=\"min-height:58px;display:flex;align-items:center;gap:12px;list-style:none;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#EAE1CF\">\n            <span style=\"flex:1\">Syringe settings<\u002Fspan>\n            <span id=\"syringeSummary\" style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:none;color:#8F8672;text-align:right;overflow-wrap:anywhere;max-width:55%\">U-100 · 1 mL · 1-unit lines<\u002Fspan>\n            <span class=\"marker\" style=\"font-size:16px;color:#5BC0EE;flex:none\">+<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 16px;padding:4px 0 22px\">\n            <div>\n              <label for=\"scale\" style=\"display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#C9BEA6;margin-bottom:8px\">Markings per mL<\u002Flabel>\n              <input id=\"scale\" sc-camel-default-value=\"100\" inputmode=\"decimal\" maxlength=\"80\" autocomplete=\"off\" aria-describedby=\"scale-error syringe-help\" style=\"width:100%;border:1px solid rgba(247,241,229,.14);border-radius:6px;min-height:44px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:rgba(5,5,6,.5);color:#FDFBF5\">\n              <div class=\"presets\" data-for=\"scale\" role=\"group\" aria-label=\"Syringe scale options\" style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:9px\"><\u002Fdiv>\n              <p id=\"scale-error\" hidden=\"\" style=\"margin:8px 0 0;font-size:11px;color:#E09B2C\"><\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <label for=\"capacity\" style=\"display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#C9BEA6;margin-bottom:8px\">Capacity (mL)<\u002Flabel>\n              <input id=\"capacity\" sc-camel-default-value=\"1\" inputmode=\"decimal\" maxlength=\"80\" autocomplete=\"off\" aria-describedby=\"capacity-error syringe-help\" style=\"width:100%;border:1px solid rgba(247,241,229,.14);border-radius:6px;min-height:44px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:rgba(5,5,6,.5);color:#FDFBF5\">\n              <div class=\"presets\" data-for=\"capacity\" role=\"group\" aria-label=\"Syringe capacity options\" style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:9px\"><\u002Fdiv>\n              <p id=\"capacity-error\" hidden=\"\" style=\"margin:8px 0 0;font-size:11px;color:#E09B2C\"><\u002Fp>\n            <\u002Fdiv>\n            <div style=\"grid-column:1 / -1\">\n              <label for=\"graduation\" style=\"display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#C9BEA6;margin-bottom:8px\">Smallest marked interval (syringe units)<\u002Flabel>\n              <input id=\"graduation\" sc-camel-default-value=\"2\" inputmode=\"decimal\" maxlength=\"80\" autocomplete=\"off\" aria-describedby=\"graduation-error syringe-help\" style=\"width:100%;border:1px solid rgba(247,241,229,.14);border-radius:6px;min-height:44px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:15px;background:rgba(5,5,6,.5);color:#FDFBF5\">\n              <div class=\"presets\" data-for=\"graduation\" role=\"group\" aria-label=\"Syringe interval options\" style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:9px\"><\u002Fdiv>\n              <p id=\"graduation-error\" hidden=\"\" style=\"margin:8px 0 0;font-size:11px;color:#E09B2C\"><\u002Fp>\n              <p id=\"syringe-help\" style=\"margin:10px 0 0;font-size:11px;line-height:1.7;color:#8F8672\">Match all three settings to your syringe. Common U-100 sizes are 0.3 mL (30 units), 0.5 mL (50 units) and 1 mL (100 units). U-100 has 100 units per mL, regardless of capacity. <a href=\"https://medlineplus.gov/ency/patientinstructions/000660.htm\" target=\"_blank\" rel=\"noopener noreferrer\">Unit reference<\u002Fa>.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"tipModal\" hidden=\"\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"tipTitle\" aria-describedby=\"tipBody\" style=\"position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,6,.74)\">\n      <div style=\"width:min(430px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid rgba(247,241,229,.14);border-radius:14px;background:#101216;box-shadow:inset 3px 0 0 #5BC0EE,inset 0 1px 0 rgba(255,255,255,.045),0 30px 90px rgba(0,0,0,.6);padding:24px\">\n        <span style=\"display:block;color:#5BC0EE;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase\">Suggestion<\u002Fspan>\n        <h2 id=\"tipTitle\" style=\"font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:400;letter-spacing:-.02em;line-height:1.12;color:#FDFBF5;margin:12px 0 0\">Consider 3 mL syringes for reconstitution<\u002Fh2>\n        <p id=\"tipBody\" style=\"margin:14px 0 0;font-size:13px;line-height:1.75;color:#C9BEA6\">A 3 mL syringe holds a full recon volume in one draw. Insulin syringes top out at 1 mL, so a 2 mL recon means several fills and more chance of losing count. Keep your insulin syringe for measuring the dose, and use a 3 mL for adding bac water.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:20px\">\n          <button id=\"tipUse3\" type=\"button\" style=\"flex:1 1 150px;min-height:46px;padding:0 16px;border:1px solid #5BC0EE;border-radius:6px;background:#5BC0EE;color:#050506;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer\">I have 3 mL<\u002Fbutton>\n          <button id=\"tipDismiss\" type=\"button\" style=\"flex:1 1 120px;min-height:46px;padding:0 16px;border:1px solid rgba(247,241,229,.19);border-radius:6px;background:transparent;color:#EAE1CF;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer\">Dismiss<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p id=\"resultAnnouncement\" role=\"status\" aria-atomic=\"true\" style=\"position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0\"><\u002Fp>\n  <\u002Fmain>\n\n  \n\n  <footer style=\"position:relative;z-index:1;border-top:1px solid rgba(247,241,229,.10);margin-top:56px;padding:30px 0 40px\">\n    <div style=\"width:min(1180px,calc(100% - 40px));margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px\">\n      <p style=\"margin:0;color:#8F8672;font-size:10px;line-height:1.8;max-width:62ch\">Calculation and education only. This tool calculates quantities you enter; it does not choose a dose or establish that a substance is safe to use. Confirm dosing and measurement instructions with a qualified healthcare professional.<\u002Fp>\n      <img src=\"bdbe4d4c-6cfa-4fec-a266-682797da2321\" alt=\"DØSΞ\" style=\"width:150px;height:auto;opacity:.8;justify-self:center\">\n      <div style=\"justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px\">\n        <a href=\"https://discord.gg/sR7ty2Z6h9\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#8F8672;font-size:8px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none\" style-hover=\"color:#FDFBF5;text-decoration:none\">Discord ↗<\u002Fa>\n        <a href=\"https://x.com/BioChemSocietyX\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#8F8672;font-size:8px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none\" style-hover=\"color:#FDFBF5;text-decoration:none\">X ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultSyringe&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;U-100&quot;,&quot;U-40&quot;],&quot;default&quot;:&quot;U-100&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Defaults&quot;},&quot;showNav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (this._booted) return;\n    this._booted = true;\n    const root = this.rootEl || document;\n    const $ = id => root.querySelector('#' + id) || document.getElementById(id);\n    const qsa = sel => Array.from((root.querySelectorAll ? root : document).querySelectorAll(sel));\n\n    const setText = (id, text) => { const el = $(id); if (el) el.textContent = text; };\n    const CREAM = '#FDFBF5', MUTED = '#8F8672', AZURE = '#5BC0EE', AMBER = '#E09B2C';\n    const AZURE_FILL = 'linear-gradient(180deg,#5BC0EE,#2578BE)';\n    const AMBER_FILL = 'linear-gradient(180deg,#F0BE72,#C07A18)';\n\n    const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a < 0n ? -a : a; };\n    class Q {\n      constructor(n, d = 1n) {\n        if (!d) throw new Error('Division by zero');\n        if (d < 0n) { n = -n; d = -d; }\n        const g = gcd(n, d); this.n = n / g; this.d = d / g;\n      }\n      mul(b) { return new Q(this.n * b.n, this.d * b.d); }\n      div(b) { return new Q(this.n * b.d, this.d * b.n); }\n      cmp(b) { const delta = this.n * b.d - b.n * this.d; return delta < 0n ? -1 : delta > 0n ? 1 : 0; }\n      floor() { return this.n / this.d; }\n    }\n    function parse(value) {\n      const s = String(value).trim();\n      if (!s) throw new Error('Enter a number greater than zero.');\n      if (s.length > 80 || !/^\\+?(?:\\d+(?:\\.\\d*)?|\\.\\d+)(?:e[+-]?\\d+)?$/i.test(s))\n        throw new Error('Use a positive number with a decimal point, without commas.');\n      const [mantissa, exponent = '0'] = s.toLowerCase().split('e');\n      if (Math.abs(Number(exponent)) > 30) throw new Error('Use an exponent between \\u221230 and 30.');\n      const [whole, decimal = ''] = mantissa.replace('+', '').split('.');\n      if ((whole + decimal).length > 30) throw new Error('Use no more than 30 digits.');\n      const power = Number(exponent) - decimal.length;\n      let n = BigInt((whole || '0') + decimal), d = 1n;\n      if (power >= 0) n *= 10n ** BigInt(power); else d = 10n ** BigInt(-power);\n      if (n <= 0n) throw new Error('Enter a number greater than zero.');\n      return new Q(n, d);\n    }\n    function fmt(q) {\n      if (!q.n) return '0';\n      const ten = e => 10n ** BigInt(e);\n      let exponent = q.n.toString().length - q.d.toString().length;\n      if (exponent >= 0 ? q.n < q.d * ten(exponent) : q.n * ten(-exponent) < q.d) exponent--;\n      if (exponent >= 9 || exponent < -5) {\n        const shift = 7 - exponent;\n        const n = shift >= 0 ? q.n * ten(shift) : q.n;\n        const d = shift >= 0 ? q.d : q.d * ten(-shift);\n        const approximate = n % d !== 0n;\n        let digits = (2n * n + d) / (2n * d);\n        if (digits >= 100000000n) { digits /= 10n; exponent++; }\n        const raw = digits.toString().padStart(8, '0');\n        const tail = raw.slice(1).replace(/0+$/, '');\n        return (approximate ? '\\u2248 ' : '') + raw[0] + (tail ? '.' + tail : '') + 'e' + (exponent >= 0 ? '+' : '') + exponent;\n      }\n      const factorTen = 100000000n;\n      const rounded = (2n * q.n * factorTen + q.d) / (2n * q.d);\n      const tail = (rounded % factorTen).toString().padStart(8, '0').replace(/0+$/, '');\n      return (q.n * factorTen % q.d ? '\\u2248 ' : '') + (rounded / factorTen).toString() + (tail ? '.' + tail : '');\n    }\n\n    const ONE = new Q(1n), HUNDRED = new Q(100n), THOUSAND = new Q(1000n);\n    const MASS = { mg: '1', mcg: '.001', g: '1000', ng: '.000001' };\n    const VOLUME = { mL: '1', '\\u00b5L': '.001', L: '1000' };\n    const massOptions = [['mg', 'mg'], ['mcg', 'mcg (\\u00b5g)']];\n    const volumeOptions = [['mL', 'mL'], ['\\u00b5L', '\\u00b5L']];\n    function setOptions(id, groups, selected) {\n      const nodes = groups.map(([label, choices]) => {\n        const group = document.createElement('optgroup'); group.label = label;\n        choices.forEach(([value, text]) => group.append(new Option(text, value, value === selected, value === selected)));\n        return group;\n      });\n      $(id).replaceChildren(...nodes);\n    }\n    setOptions('vialUnit', [['Amount', massOptions]], 'mg');\n    setOptions('liquidUnit', [['Volume', volumeOptions]], 'mL');\n    setOptions('doseUnit', [['Amount', massOptions], ['Volume', volumeOptions]], 'mg');\n\n    const syringePreset = this.props.defaultSyringe === 'U-40' ? '40' : '100';\n    const DEFAULTS = { vial: '5', liquid: '2', dose: '0.25', scale: syringePreset, capacity: '1', graduation: '2', drawUnits: '', vialUnit: 'mg', liquidUnit: 'mL', doseUnit: 'mg' };\n    $('scale').value = syringePreset;\n    if (this.props.showNav === false) { const w = $('navWrap'); if (w) w.style.display = 'none'; }\n    const fixedPresets = { scale: ['100', '40'], capacity: ['0.3', '0.5', '1', '3'], graduation: ['0.5', '1', '2'], drawUnits: ['5', '10', '20', '25'] };\n    let mode = 'forward';\n    let lastSyringeKey = '';\n    let pristine = true;\n    const PRIMARY_INPUTS = ['vial', 'liquid', 'dose'];\n    const DEFAULT_DRAW = '10';\n    // Explicit syringe profiles: allowed smallest-graduation choices per capacity (in syringe units).\n    const SYRINGE_GRADS = { '0.3': ['0.5', '1'], '0.5': ['1'], '1': ['1', '2'] };\n    function gradValues() {\n      const cap = Number($('capacity') ? $('capacity').value.trim() : '1');\n      const perMl = Number($('scale') ? $('scale').value.trim() : '100');\n      if (!Number.isFinite(cap) || cap <= 0 || !Number.isFinite(perMl) || perMl <= 0) return ['0.5', '1', '2'];\n      if (cap >= ML_MARK_MIN) return [fmtNum(Math.round(0.1 * perMl * 10000) / 10000)];\n      return SYRINGE_GRADS[fmtNum(cap)] || ['0.5', '1', '2'];\n    }\n    function gradLabel(gradQ, capQ, scaleQ) {\n      const cap = num(capQ), perMl = num(scaleQ), g = num(gradQ);\n      return cap >= ML_MARK_MIN\n        ? fmtNum(Math.round((g / perMl) * 10000) / 10000) + ' mL lines'\n        : fmt(gradQ) + '-unit lines';\n    }\n    const primaryUnits = { vial: 'vialUnit', liquid: 'liquidUnit', dose: 'doseUnit' };\n    function presetValues(id, unit) {\n      if (id === 'graduation') return gradValues();\n      if (fixedPresets[id]) return fixedPresets[id];\n      if (id === 'vial') return { mg: ['2', '5', '10', '20'], mcg: ['1000', '2000', '5000'], g: ['0.002', '0.005', '0.01'], ng: ['1000000', '5000000'] }[unit] || [];\n      if (id === 'liquid') return { mL: ['0.5', '1', '2', '3'], '\\u00b5L': ['500', '1000', '2000'], L: ['0.001', '0.002', '0.003'], syringe: ['50', '100', '200'] }[unit] || [];\n      return { mcg: ['100', '250', '500', '1000'], mg: ['0.1', '0.25', '0.5', '1'], g: ['0.0001', '0.00025', '0.0005'], ng: ['100000', '250000', '500000'], mL: ['0.05', '0.1', '0.25', '0.5'], '\\u00b5L': ['50', '100', '250', '500'], L: ['0.00005', '0.0001', '0.00025'], syringe: ['5', '10', '20', '50'] }[unit] || [];\n    }\n    function unitLabel(unit) {\n      return { syringe: 'syringe units' }[unit] || unit;\n    }\n    function equalInput(a, b) { try { return parse(a).cmp(parse(b)) === 0; } catch { return false; } }\n    function presetLabel(id, value) {\n      if (id === 'scale') return 'U-' + value;\n      if (id === 'graduation') {\n        const per = Number($('scale') ? $('scale').value : 100) || 100;\n        return value + 'u \\u00b7 ' + fmtNum(Math.round((Number(value) / per) * 100000) / 100000) + ' mL';\n      }\n      if (id !== 'capacity') return value;\n      const perMl = Number($('scale') ? $('scale').value : 100);\n      const units = Number(value) * perMl;\n      if (!Number.isFinite(units) || units <= 0) return value + ' mL';\n      return value + ' mL \\u00b7 ' + (Math.round(units * 100) / 100) + 'U';\n    }\n    function stylePreset(button, on) {\n      button.style.borderColor = on ? 'rgba(91,192,238,.38)' : 'rgba(247,241,229,.12)';\n      button.style.background = on ? 'rgba(91,192,238,.07)' : 'transparent';\n      button.style.color = on ? AZURE : '#C9BEA6';\n    }\n    function drawPresets() {\n      qsa('[data-for]').forEach(group => {\n        const id = group.dataset.for, unit = primaryUnits[id] ? $(primaryUnits[id]).value : '';\n        const values = presetValues(id, unit);\n        const key = unit + '|' + values.join('|') + (id === 'capacity' && $('scale') ? '|' + $('scale').value : '');\n        group.hidden = values.length === 0;\n        if (group.dataset.key !== key) {\n          group.dataset.key = key;\n          group.replaceChildren(...values.map(value => {\n            const button = document.createElement('button');\n            button.type = 'button'; button.dataset.value = value;\n            button.style.cssText = 'border:1px solid rgba(247,241,229,.12);border-radius:5px;background:transparent;color:#C9BEA6;padding:6px 10px;font-family:\\'IBM Plex Mono\\',monospace;font-size:11px;letter-spacing:.04em;min-width:44px;min-height:34px;cursor:pointer;transition:border-color 150ms,background 150ms,color 150ms';\n            button.textContent = presetLabel(id, value);\n            button.setAttribute('aria-label', 'Set ' + $(id).labels[0].textContent + ' to ' + presetLabel(id, value) + (unit ? ' ' + unitLabel(unit) : ''));\n            button.addEventListener('mouseenter', () => { if (button.getAttribute('aria-pressed') !== 'true') { button.style.borderColor = 'rgba(91,192,238,.28)'; button.style.color = CREAM; } });\n            button.addEventListener('mouseleave', () => stylePreset(button, button.getAttribute('aria-pressed') === 'true'));\n            button.addEventListener('click', () => { $(id).value = value; hideUnitNote(id); update(); });\n            return button;\n          }));\n        }\n        group.querySelectorAll('button').forEach(button => {\n          const on = equalInput($(id).value, button.dataset.value);\n          button.setAttribute('aria-pressed', String(on));\n          stylePreset(button, on);\n        });\n      });\n    }\n    function hideUnitNote(id) { if ($(id + '-note')) $(id + '-note').hidden = true; }\n    function setFieldValid(id, valid) {\n      const input = $(id);\n      input.style.color = valid ? CREAM : AMBER;\n      const entry = input.closest('.entry');\n      if (entry) entry.style.borderColor = valid ? 'rgba(247,241,229,.14)' : 'rgba(224,155,44,.5)';\n      else input.style.borderColor = valid ? 'rgba(247,241,229,.14)' : 'rgba(224,155,44,.5)';\n    }\n    function markInvalid(id, message) {\n      $(id).setAttribute('aria-invalid', 'true');\n      setFieldValid(id, false);\n      const error = $(id + '-error'); error.textContent = message; error.hidden = false;\n      const details = $(id).closest('details'); if (details) { details.open = true; syncMarker(details); }\n    }\n    function isVolume(unit) { return Object.hasOwn(VOLUME, unit) || unit === 'syringe'; }\n    function factor(unit, values) {\n      if (Object.hasOwn(MASS, unit)) return parse(MASS[unit]);\n      if (Object.hasOwn(VOLUME, unit)) return parse(VOLUME[unit]);\n      if (unit === 'syringe') return ONE.div(values.scale);\n      return values[unit];\n    }\n    function scaleName(q) { return q.cmp(HUNDRED) === 0 ? 'U-100' : q.cmp(new Q(40n)) === 0 ? 'U-40' : fmt(q) + ' units/mL'; }\n\n    function setStyle(id, prop, value) { const el = $(id); if (el) el.style[prop] = value; }\n    const DRAW_DELAY = 420, DRAW_MS = 1650, DRAW_EASE = 'cubic-bezier(.33,.02,.24,1)';\n    const REDUCE = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };\n    if (REDUCE.matches) setStyle('fillSheen', 'animation', 'none');\n    function setGraphicValid(on) {\n      setStyle('syringeGraphic', 'opacity', on ? '1' : '.38');\n      setStyle('tickRow', 'opacity', on ? '1' : '.38');\n      setStyle('tickRowMl', 'opacity', on ? '1' : '.38');\n      setStyle('multiSyringe', 'opacity', on ? '1' : '.38');\n    }\n    const draw = { pct: null, sig: null, target: null, timer: 0, raf: 0, settle: 0 };\n    function easeDraw(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }\n    function runDraw(target, ms) {\n      const DUR = ms || DRAW_MS;\n      if (document.hidden) { syringeTransition(0); placeSyringe(target); return; }\n      const t0 = performance.now();\n      const step = now => {\n        const t = Math.min(1, (now - t0) / DUR);\n        placeSyringe(target * easeDraw(t));\n        if (t < 1) draw.raf = requestAnimationFrame(step);\n      };\n      draw.raf = requestAnimationFrame(step);\n      clearTimeout(draw.settle);\n      draw.settle = setTimeout(() => { cancelAnimationFrame(draw.raf); placeSyringe(target); }, DUR + 120);\n    }\n    document.addEventListener('visibilitychange', () => {\n      if (document.hidden && draw.target !== null && draw.target !== undefined) {\n        clearTimeout(draw.timer); clearTimeout(draw.settle); cancelAnimationFrame(draw.raf);\n        syringeTransition(0); placeSyringe(draw.target);\n      }\n    });\n    function placeSyringe(p) {\n      setStyle('fill', 'width', p + '%');\n      setStyle('fillSheen', 'width', p + '%');\n      setStyle('stopper', 'right', p + '%');\n      setStyle('plungerRod', 'right', p + '%');\n    }\n    function syringeTransition(ms) {\n      const t = ms ? ms + 'ms ' + DRAW_EASE : '0ms';\n      setStyle('fill', 'transition', 'width ' + t + ', background 220ms linear');\n      setStyle('fillSheen', 'transition', 'width ' + t);\n      setStyle('stopper', 'transition', 'right ' + t);\n      setStyle('plungerRod', 'transition', 'right ' + t);\n    }\n    function setSyringe(percent, tone, signature) {\n      const p = Math.max(0, Math.min(100, percent));\n      const sig = signature === undefined ? String(p) : signature;\n      setStyle('fill', 'background', tone === 'warning' ? AMBER_FILL : AZURE_FILL);\n      if (sig === draw.sig) return;\n      draw.sig = sig;\n      clearTimeout(draw.timer);\n      clearTimeout(draw.settle);\n      cancelAnimationFrame(draw.raf);\n      draw.target = p;\n      draw.pct = p;\n      syringeTransition(0);\n      if (p === 0) { placeSyringe(p); return; }\n      placeSyringe(0);\n      // Reduced motion still draws, just shorter and without the hold.\n      const delay = REDUCE.matches ? 0 : DRAW_DELAY, dur = REDUCE.matches ? 520 : DRAW_MS;\n      draw.timer = setTimeout(() => runDraw(p, dur), delay);\n    }\n    const MAX_SYRINGES = 10;\n    let stackTimers = [];\n    function num(q) { return Number(q.n) / Number(q.d); }\n    function fmtNum(n) { return String(Math.round(n * 10000) / 10000); }\n    function clearStackTimers() { stackTimers.forEach(clearTimeout); stackTimers = []; }\n    function marksSpec(capMl, perMl, gradUnits) {\n      const ml = capMl >= ML_MARK_MIN;\n      const capUnits = capMl * perMl;\n      const big = capUnits > 50 + 1e-9;\n      const label = ml ? 0.5 : (big ? 10 : 5) / perMl;\n      let minor = ml ? 0.1 : (big ? 2 : 1) / perMl;\n      if (Number.isFinite(gradUnits) && gradUnits > 0) {\n        const g = gradUnits / perMl;\n        if (g <= label + 1e-12 && capMl / g <= 200 + 1e-9) minor = g;\n      }\n      return { minor, label, text: ml ? v => fmtNum(Math.round(v * 100) / 100) : v => fmtNum(Math.round(v * perMl * 100) / 100) };\n    }\n    function buildTickSpans(capMl, perMl) {\n      const spec = marksSpec(capMl, perMl);\n      const spans = [];\n      for (let i = 0; i * spec.label <= capMl + 1e-9; i++) {\n        const v = i * spec.label;\n        const edge = i === 0 || Math.abs(v - capMl) < 1e-9;\n        const s = document.createElement('span');\n        s.style.cssText = 'position:absolute;left:' + (100 - (v / capMl) * 100) + '%;transform:translateX(-50%);color:' + (edge ? '#C9BEA6' : '#8F8672') + \";font-family:'IBM Plex Mono',monospace;font-size:\" + (edge ? '10px' : '9px') + ';white-space:nowrap';\n        s.textContent = spec.text(v);\n        spans.push(s);\n      }\n      return spans;\n    }\n    function buildSyringeRow(index, total, pct, ml, units, tone, capMl, perMl, labeled, gradUnits) {\n      const row = document.createElement('div');\n      row.style.cssText = 'display:grid;gap:6px';\n      const head = document.createElement('div');\n      head.style.cssText = 'display:flex;justify-content:space-between;gap:10px;color:#8F8672;font-family:\\'IBM Plex Mono\\',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase';\n      const left = document.createElement('span');\n      left.textContent = 'Syringe ' + index + ' of ' + total;\n      const right = document.createElement('span');\n      right.style.color = '#C9BEA6';\n      right.textContent = fmtNum(ml) + ' mL \\u00b7 ' + fmtNum(units) + 'U';\n      head.append(left, right);\n      const barrel = docum        document.body.append(textarea); textarea.focus(); textarea.select();\n        try { copied = document.execCommand('copy'); } catch { copied = false; }\n        textarea.remove(); $('copy').focus({ preventScroll: true });\n      }\n      if (copied) {\n        $('copy').textContent = 'Copied \\u2713'; $('copyPanel').hidden = true;\n        $('copyFeedback').textContent = 'Calculation copied.'; $('copyFeedback').hidden = false;\n        copyTimer = setTimeout(() => { if (currentRevision === revision) { setText('copy', 'Copy Calculation'); if ($('copyFeedback')) $('copyFeedback').hidden = true; } }, 2200);\n      } else {\n        $('copyOutput').value = snapshot; $('copyPanel').hidden = false; selectCopyText();\n      }\n    });\n\n    qsa('details').forEach(details => {\n      syncMarker(details);\n      details.addEventListener('toggle', () => syncMarker(details));\n    });\n\n    const hoverable = window.matchMedia('(hover:hover)').matches;\n    if (hoverable) {\n      qsa('.liquid, nav').forEach(element => {\n        const light = element.querySelector('.cursor-light');\n        if (!light) return;\n        element.addEventListener('pointermove', event => {\n          const rect = element.getBoundingClientRect();\n          light.style.left = (event.clientX - rect.left) + 'px';\n          light.style.top = (event.clientY - rect.top) + 'px';\n          light.style.opacity = '1';\n        });\n        element.addEventListener('pointerleave', () => { if (!element.matches('nav')) light.style.opacity = '0'; });\n        if (element.classList.contains('liquid')) {\n          element.addEventListener('pointerenter', () => { element.style.borderColor = 'rgba(91,192,238,.25)'; });\n          element.addEventListener('pointerleave', () => { element.style.borderColor = 'rgba(247,241,229,.10)'; });\n        }\n      });\n    }\n\n    const nav = $('nav'), brandCopy = $('brandCopy'), navLinks = $('navLinks'), navMinimize = $('navMinimize');\n    let lastY = window.scrollY, queued = false, collapsed = false, recollapseTimer = null;\n    let minimized = false;\n    try { minimized = sessionStorage.getItem('bcsNavMinimized') === '1'; } catch { /* storage unavailable */ }\n    const setCollapsed = on => {\n      if (on === collapsed) return;\n      collapsed = on;\n      nav.style.maxWidth = on ? '57px' : '100%';\n      nav.style.minHeight = on ? '51px' : '58px';\n      nav.style.padding = on ? '10px' : '10px 16px';\n      nav.style.borderRadius = on ? '16px' : '14px';\n      [brandCopy, navLinks].forEach(el => {\n        el.style.opacity = on ? '0' : '1';\n        el.style.transform = on ? 'translateX(-8px)' : 'none';\n        el.style.pointerEvents = on ? 'none' : 'auto';\n      });\n      if (navMinimize) {\n        navMinimize.style.opacity = on ? '1' : '0';\n        navMinimize.style.pointerEvents = on ? 'auto' : 'none';\n      }\n    };\n    const setMinimized = on => {\n      minimized = on;\n      try { sessionStorage.setItem('bcsNavMinimized', on ? '1' : '0'); } catch { /* storage unavailable */ }\n      navWrapEl.style.transition = 'opacity 300ms cubic-bezier(.22,1,.36,1)';\n      navWrapEl.style.opacity = on && window.scrollY >= 80 ? '0' : '1';\n      navWrapEl.style.pointerEvents = on && window.scrollY >= 80 ? 'none' : 'auto';\n    };\n    const navWrapEl = $('navWrap');\n    if (minimized) setMinimized(true);\n    const onScroll = () => {\n      queued = false;\n      const y = Math.max(0, window.scrollY), delta = y - lastY;\n      if (minimized) {\n        const atTop = y < 80;\n        navWrapEl.style.opacity = atTop ? '1' : '0';\n        navWrapEl.style.pointerEvents = atTop ? 'auto' : 'none';\n        lastY = y;\n        return;\n      }\n      if (Math.abs(delta) > 4) {\n        if (delta > 0 && y > 130) setCollapsed(true);\n        else if (delta < 0) setCollapsed(false);\n        lastY = y;\n      }\n      if (y < 80) setCollapsed(false);\n    };\n    window.addEventListener('scroll', () => { if (queued) return; queued = true; requestAnimationFrame(onScroll); }, { passive: true });\n    if (hoverable) {\n      nav.addEventListener('pointerenter', () => {\n        clearTimeout(recollapseTimer);\n        if (collapsed) setCollapsed(false);\n      });\n      nav.addEventListener('pointerleave', () => {\n        clearTimeout(recollapseTimer);\n        recollapseTimer = setTimeout(() => {\n          if (!minimized && Math.max(0, window.scrollY) > 130) setCollapsed(true);\n        }, 650);\n      });\n    }\n    if (navMinimize) {\n      navMinimize.addEventListener('click', event => {\n        event.preventDefault();\n        event.stopPropagation();\n        setMinimized(true);\n      });\n    }\n\n    const seedSettings = () => Object.entries(DEFAULTS).forEach(([id, value]) => {\n      if (PRIMARY_INPUTS.includes(id)) return;\n      const el = $(id); if (el && !el.value) el.value = value;\n    });\n    const clearPrimary = () => PRIMARY_INPUTS.forEach(id => { const el = $(id); if (el) el.value = ''; });\n    seedSettings();\n    clearPrimary();\n    update();\n    requestAnimationFrame(() => { seedSettings(); clearPrimary(); update(); });\n    if ($('tipModal')) $('tipModal').hidden = true;\n    if ($('multiSyringe')) $('multiSyringe').hidden = true;\n    if ($('multiSyringeNote')) $('multiSyringeNote').hidden = true;\n    applyMode();\n    maybeShowTip();\n    // Regression tests. Run in the browser console with __pepSelfTest(), or load the page with ?selftest=1.\n    function runSelfTest() {\n      const P = s => parse(s);\n      const V = o => ({ vial: P(o.vial), liquid: P(o.liquid), dose: P(o.dose), scale: P(o.scale || '100'), capacity: P(o.capacity || '1'), graduation: P(o.graduation || '1') });\n      const rows = [];\n      const check = (name, actual, expected) => rows.push({ name, expected: String(expected), actual: String(actual), pass: String(actual) === String(expected) });\n      let r = compute(V({ vial: '5', liquid: '2', dose: '250', capacity: '1', graduation: '2' }), 'mg', 'mL', 'mcg');\n      check('case1 concentration mg/mL', fmt(r.concentration), '2.5');\n      check('case1 draw mL', fmt(r.draw), '0.1');\n      check('case1 units', fmt(r.units), '10');\n      check('case1 graduation', r.status, 'Aligns with the selected marked interval.');\n      check('case1 doses per vial', r.count, 20n);\n      const rmg = compute(V({ vial: '5', liquid: '2', dose: '0.25', capacity: '1', graduation: '2' }), 'mg', 'mL', 'mg');\n      check('mg/mcg equivalence', fmt(rmg.units), fmt(r.units));\n      const sol = P('10').mul(P('10')).div(P('100').mul(P('1')));\n      check('case2 solution mL', fmt(sol), '1');\n      const back = compute({ vial: P('10'), liquid: sol, dose: P('1'), scale: P('100'), capacity: P('0.5'), graduation: P('1') }, 'mg', 'mL', 'mg');\n      check('case2 forward draw mL', fmt(back.draw), '0.1');\n      check('case2 forward units', fmt(back.units), '10');\n      check('case2 forward mass mg', fmt(back.dose), '1');\n      r = compute(V({ vial: '2', liquid: '1', dose: '0.5', capacity: '3', graduation: '10' }), 'mg', 'mL', 'mg');\n      check('case3 draw mL', fmt(r.draw), '0.25');\n      check('case3 units', fmt(r.units), '25');\n      check('case3 between marks', r.status, 'Between marked intervals. No rounding to a syringe line has been applied.');\n      check('case3 within capacity', r.ratio.cmp(ONE) <= 0, true);\n      r = compute(V({ vial: '5', liquid: '2', dose: '0.1', capacity: '1', graduation: '2' }), 'mg', 'mL', 'mL');\n      check('mL dose draw mL', fmt(r.draw), '0.1');\n      check('mL dose mass mg', fmt(r.dose), '0.25');\n      r = compute(V({ vial: '5', liquid: '2', dose: '3', capacity: '1', graduation: '1' }), 'mg', 'mL', 'mg');\n      check('overflow draw mL', fmt(r.draw), '1.2');\n      check('overflow flagged', r.warnings.includes('Volume exceeds the selected syringe capacity.'), true);\n      r = compute(V({ vial: '5', liquid: '2', dose: '0.001', capacity: '1', graduation: '1' }), 'mg', 'mL', 'mg');\n      check('tiny dose below interval', r.warnings[0], 'Below the smallest marked interval.');\n      r = compute(V({ vial: '1', liquid: '3', dose: '100', capacity: '1', graduation: '1' }), 'mg', 'mL', 'mcg');\n      check('repeating decimal draw mL', fmt(r.draw), '0.3');\n      const split = (total, cap) => { const n = Math.max(1, Math.ceil(total / cap - 1e-9)); const parts = []; for (let i = 0; i < n; i++) parts.push(Math.min(cap, total - i * cap)); return parts; };\n      check('exact capacity portions', split(1, 1).length, 1);\n      check('overflow portions', split(1.2, 1).length, 2);\n      check('portions sum to total', Math.abs(split(1.2, 1).reduce((a, b) => a + b, 0) - 1.2) < 1e-9, true);\n      check('no float residual syringe', split(0.3, 0.1).length, 3);\n      check('3 mL minor mL', marksSpec(3, 100, 10).minor, 0.1);\n      check('3 mL label mL', marksSpec(3, 100, 10).label, 0.5);\n      check('100U minor mL', marksSpec(1, 100, 2).minor, 0.02);\n      check('100U label mL', marksSpec(1, 100, 2).label, 0.1);\n      check('50U minor mL', marksSpec(0.5, 100, 1).minor, 0.01);\n      check('50U label mL', marksSpec(0.5, 100, 1).label, 0.05);\n      check('30U minor mL', marksSpec(0.3, 100, 1).minor, 0.01);\n      check('30U label mL', marksSpec(0.3, 100, 1).label, 0.05);\n      ['', '-1', '0', 'abc', '1,5', '1e99'].forEach(bad => {\n        let threw = false;\n        try { parse(bad); } catch { threw = true; }\n        check('rejects \"' + bad + '\"', threw, true);\n      });\n      const failed = rows.filter(row => !row.pass);\n      console.log('Peptide calculator self-test: ' + (rows.length - failed.length) + '/' + rows.length + ' passed');\n      if (failed.length) console.table(failed); else console.table(rows);\n      window.__pepTestResult = { total: rows.length, failed };\n      return rows;\n    }\n    window.__pepSelfTest = runSelfTest;\n    if (/[?&]selftest=1/.test(location.search)) runSelfTest();\n    this._update = update;\n  }\n  componentDidUpdate() {\n    if (this._update) requestAnimationFrame(() => this._update());\n  }\n  renderVals() { return {}; }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
